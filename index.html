<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H;

function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);


/* =========================
   MUSIK
========================= */

let audioCtx = null;
let musicStarted = false;

function startMusic(){

    if(musicStarted) return;

    musicStarted = true;

    audioCtx = new (
        window.AudioContext ||
        window.webkitAudioContext
    )();

    const notes = [
        261.63,293.66,329.63,392.00,
        329.63,293.66,261.63,
        220.00,261.63,293.66,
        329.63,392.00
    ];

    let i = 0;

    function playNote(){

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "sine";
        osc.frequency.value = notes[i];

        /* volume lebih keras */
        gain.gain.setValueAtTime(
            0.18,
            audioCtx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.01,
            audioCtx.currentTime + 0.7
        );

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.72);

        i++;

        if(i >= notes.length){
            i = 0;
        }

        setTimeout(playNote,720);
    }

    playNote();
}


/* =========================
   BENTUK HATI
========================= */

function heart(t){

    return {
        x:16 * Math.sin(t) ** 3,

        y:
        13 * Math.cos(t)
        -5 * Math.cos(2*t)
        -2 * Math.cos(3*t)
        -Math.cos(4*t)
    };
}


/* =========================
   PARTIKEL
========================= */

const particles = [];
const jumlah = 2000;

for(let i=0;i<jumlah;i++){

    const t =
        Math.random() * Math.PI * 2;

    const h = heart(t);

    particles.push({

        x:0,
        y:0,

        targetX:h.x,
        targetY:h.y,

        size:
            0.5 +
            Math.random() * 2,

        speed:
            0.008 +
            Math.random() * 0.025,

        delay:
            Math.random() * 1.5
    });
}


/* =========================
   ANIMASI
========================= */

const startTime = performance.now();

function animate(time){

    ctx.fillStyle =
        "rgba(0,0,0,0.20)";

    ctx.fillRect(
        0,0,W,H
    );

    const elapsed =
        (time - startTime) / 1000;

    const scale =
        Math.min(W,H) / 42;

    let pulse;


/* HATI TUMBUH ±3 DETIK */

    if(elapsed < 3){

        let p = elapsed / 3;

        p =
            p * p *
            (3 - 2 * p);

        pulse = p;

    }else{

/* DENYUT SETELAH TERBENTUK */

        pulse =
            1 +
            Math.sin(elapsed * 3.5)
            * 0.045;
    }


/* GAMBAR TITIK */

    for(const p of particles){

        if(elapsed > p.delay){

            p.x +=
                (p.targetX - p.x)
                * p.speed;

            p.y +=
                (p.targetY - p.y)
                * p.speed;

            const x =
                W / 2 +
                p.x * scale * pulse;

            const y =
                H / 2 -
                p.y * scale * pulse;

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                p.size,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                "rgb(255,35,75)";

            ctx.shadowBlur = 12;

            ctx.shadowColor =
                "#ff1744";

            ctx.fill();
        }
    }

    ctx.shadowBlur = 0;

    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);


/* =========================
   SENTUH PERTAMA
   HANYA UNTUK MUSIK
========================= */

function firstTouch(){

    startMusic();

    document.removeEventListener(
        "touchstart",
        firstTouch
    );

    document.removeEventListener(
        "click",
        firstTouch
    );
}

document.addEventListener(
    "touchstart",
    firstTouch,
    {passive:true}
);

document.addEventListener(
    "click",
    firstTouch
);
</script>

</body>
</html>
